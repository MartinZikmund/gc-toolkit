name: Build Android Packages

on:
  # Push to main: Dev-channel AAB (Dev applicationId, sideload-safe; no Play upload).
  # Push to release/v*: Prod-channel AAB uploaded to Google Play Production track.
  # See docs/versioning.md for the full model.
  push:
    branches:
      - "main"
      - "release/v**"
  workflow_dispatch:

env:
  # App Configuration
  APP_NAME: GcToolkit
  DOTNET_VERSION: 10.0.x
  SOLUTION_FILE: src/GcToolkit.slnx
  PROJECT_PATH: src/GcToolkit
  PROJECT_FILE: src/GcToolkit/GcToolkit.csproj
  ANDROID_TARGET_FRAMEWORK: net10.0-android

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_android:
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # .NET niceties
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      ContinuousIntegrationBuild: true

    steps:
      - name: Compute app channel
        id: channel
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/heads/release/v* ]]; then
            echo "value=Prod" >> "$GITHUB_OUTPUT"
            echo "package_name=dev.mzikmund.gctoolkit" >> "$GITHUB_OUTPUT"
            echo "play_track=production" >> "$GITHUB_OUTPUT"
          else
            echo "value=Dev" >> "$GITHUB_OUTPUT"
            echo "package_name=dev.mzikmund.gctoolkit.dev" >> "$GITHUB_OUTPUT"
            echo "play_track=" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Cache NuGet to speed up restores
      - name: NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.sln*', '**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            ${{ env.DOTNET_VERSION }}

      # Only the android workload — `workload restore` on the solution would
      # also pull ios + wasm-tools, which this job never uses. No explicit
      # `dotnet restore` either: publish restores its own TFM closure (collapsed
      # to android by -p:SingleTargetFramework below, so it stays android-only).
      - name: Install .NET workloads
        run:
          dotnet workload install android --ignore-failed-sources

      # --- Signing setup (requires your keystore + secrets) ---
      # Create upload keystore file from a base64 secret
      # Dev builds fall back to the default debug key when the secrets aren't set (nothing is
      # uploaded on Dev). Prod must never ship that, so it fails instead.
      - name: Decode Android upload keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/android-upload.keystore"
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.channel.outputs.value }}" == "Prod" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is required for Prod builds."
            exit 1
          else
            echo "::warning::Android signing secrets are not set; signing with the default debug key."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # --- Build Google Play bundle (AAB) ---
      - name: Publish AAB
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          signing=()
          if [[ "${{ steps.keystore.outputs.present }}" == "true" ]]; then
            signing=(
              -p:AndroidKeyStore=true
              -p:AndroidSigningKeyStore="$GITHUB_WORKSPACE/android-upload.keystore"
              -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS"
              -p:AndroidSigningKeyPass="$ANDROID_KEY_PASSWORD"
              -p:AndroidSigningStorePass="$ANDROID_STORE_PASSWORD"
            )
          fi
          dotnet publish "${{ env.PROJECT_FILE }}" -c Release -f ${{ env.ANDROID_TARGET_FRAMEWORK }} \
            -p:SingleTargetFramework=${{ env.ANDROID_TARGET_FRAMEWORK }} \
            -p:AppChannel=${{ steps.channel.outputs.value }} \
            "${signing[@]}" \
            -p:AndroidPackageFormat=aab -p:PackageFormat=aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android_AAB
          path: |
            ${{ env.PROJECT_PATH }}/bin/Release/${{ env.ANDROID_TARGET_FRAMEWORK }}/publish/*.aab

      - name: Upload to Google Play Console
        if: steps.channel.outputs.value == 'Prod'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ steps.channel.outputs.package_name }}
          releaseFiles: ${{ env.PROJECT_PATH }}/bin/Release/${{ env.ANDROID_TARGET_FRAMEWORK }}/publish/*-Signed.aab
          track: ${{ steps.channel.outputs.play_track }}
          status: completed

      # Clean up keystore
      - name: Remove keystore
        if: ${{ always() }}
        run: rm -f "$GITHUB_WORKSPACE/android-upload.keystore"