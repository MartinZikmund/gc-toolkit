name: Build Windows Packages

on:
  # Push to main: Dev-channel package (self-signed, sideload-safe artifact).
  # Push to release/v*: Prod-channel package (Store-signed .msixupload artifact for manual Partner Center submission).
  # See docs/versioning.md for the full model.
  push:
    branches:
      - "main"
      - "release/v**"
  workflow_dispatch:

env:
  # App Configuration
  APP_NAME: GcToolkit
  DOTNET_VERSION: 10.0.x
  SOLUTION_FILE: src/GcToolkit.slnx
  PROJECT_PATH: src/GcToolkit
  PROJECT_FILE: src/GcToolkit/GcToolkit.csproj
  WINDOWS_TARGET_FRAMEWORK: net10.0-windows10.0.26100

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  create_package:
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'

    strategy:
      matrix:
        configuration: [Release]
        # Dev-channel pushes to main only need a sideload-testable x64 package;
        # release and manual dispatch builds produce the full platform set.
        platform: ${{ (startsWith(github.ref, 'refs/heads/release/') || github.event_name == 'workflow_dispatch') && fromJSON('["x86","x64","ARM64"]') || fromJSON('["x64"]') }}

    runs-on: windows-latest  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on
    timeout-minutes: 60

    outputs:
      channel: ${{ steps.channel.outputs.value }}
      version: ${{ steps.version.outputs.value }}

    env:
      # .NET niceties
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      ContinuousIntegrationBuild: true

    steps:
    - name: Compute app channel
      id: channel
      shell: pwsh
      run: |
        if ($env:GITHUB_REF -like 'refs/heads/release/v*') {
          "value=Prod" >> $env:GITHUB_OUTPUT
        } else {
          "value=Dev" >> $env:GITHUB_OUTPUT
        }

    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Restore-only: the packaging-specific delta (R2R/runtime packs) is saved
    # by a single leg below under a distinct -pkg- key, so the three matrix
    # legs don't race to compress and save the same multi-GB archive.
    - name: NuGet cache (restore)
      id: nuget
      uses: actions/cache/restore@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-pkg-${{ hashFiles('**/*.sln*', '**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props', '**/global.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-pkg-
          ${{ runner.os }}-nuget-

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          ${{ env.DOTNET_VERSION }}

    # Add  MSBuild to the PATH: https://github.com/microsoft/setup-msbuild
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    # The checked-in Package.appxmanifest is pinned to Identity Version="0.0.0.0"
    # (guarded by validate-manifest-version.yml) because Nerdbank.GitVersioning stamps
    # the real one into the *generated* manifest at build time. Reproduce that here so
    # the `merge` job can bundle under the same version: src/Directory.Build.targets
    # (SetNbgvVersionForUnoWindows) sets ApplicationDisplayVersion=$(BuildVersionSimple)
    # and ApplicationVersion=0, i.e. "{SimpleVersion}.0".
    # Only the x64 leg emits it — every matrix leg writes to the same job outputs.
    - name: Compute the package version
      id: version
      if: matrix.platform == 'x64'
      shell: pwsh
      run: |
        dotnet tool install -g nbgv
        # The global tool dir isn't guaranteed to be on PATH for this step's shell.
        $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
        $version = "$(nbgv get-version -v SimpleVersion).0"
        Write-Host "Package version: $version"
        "value=$version" >> $env:GITHUB_OUTPUT

    # Restore the application to populate the obj folder with RuntimeIdentifiers.
    # The project (not the solution) is targeted so the test projects don't get
    # dragged through every matrix leg; P2P references restore transitively.
    # SingleTargetFramework collapses to Windows so restore doesn't evaluate the
    # android/ios/wasm TFMs (no reliance on those workloads being on the runner).
    #
    # Do NOT add /p:TargetFramework here (or to the packaging step below). As a
    # *global* property it flows down the P2P graph into GcToolkit.SourceGenerators,
    # which is pinned to netstandard2.0 and knows nothing of SingleTargetFramework;
    # restore then writes its assets for the Windows TFM and the build dies with
    # NETSDK1005 ("Assets file ... doesn't have a target for 'netstandard2.0'").
    # SingleTargetFramework alone is enough — that's what main.yml builds green with.
    - name: Restore the application
      run: msbuild $env:PROJECT_FILE /m /t:Restore /p:Configuration=$env:Configuration /p:SingleTargetFramework=$env:WINDOWS_TARGET_FRAMEWORK /p:PublishReadyToRun=true /p:AppChannel=${{ steps.channel.outputs.value }}
      env:
        Configuration: ${{ matrix.configuration }}

    # Decode the base 64 encoded pfx and save the Signing_Certificate
    - name: Decode the pfx
      shell: pwsh
      run: |
        if ('${{ steps.channel.outputs.value }}' -eq 'Prod') {
          $pfxBase64 = '${{ secrets.BASE64_ENCODED_WINDOWS_PFX }}'
        } else {
          $pfxBase64 = '${{ secrets.BASE64_ENCODED_WINDOWS_PFX_DEV }}'
        }
        $pfx_cert_byte = [System.Convert]::FromBase64String($pfxBase64)
        $certificatePath = "GitHubActionsWorkflow.pfx"
        [IO.File]::WriteAllBytes("$certificatePath", $pfx_cert_byte)

    # Create the app package by building and packaging the project.
    # Dev-channel (main/dispatch) packages skip ReadyToRun — R2R compilation is
    # a large chunk of packaging time and only matters for shipped Prod builds.
    # (No /p:TargetFramework here either — see the Restore step for why.)
    - name: Create the app package
      run: msbuild $env:PROJECT_FILE /m /p:SingleTargetFramework=$env:WINDOWS_TARGET_FRAMEWORK /p:Configuration=$env:Configuration /p:Platform=$env:Platform /p:UapAppxPackageBuildMode=$env:Appx_Package_Build_Mode /p:AppxBundle=$env:Appx_Bundle /p:AppxPackageDir="$env:Appx_Package_Dir" /p:GenerateAppxPackageOnBuild=true /p:AppChannel=${{ steps.channel.outputs.value }} $env:R2R_ARGS
      env:
        Appx_Bundle: Never
        Appx_Package_Build_Mode: CI
        Appx_Package_Dir: Packages\
        Configuration: ${{ matrix.configuration }}
        Platform: ${{ matrix.platform }}
        R2R_ARGS: ${{ steps.channel.outputs.value == 'Dev' && '/p:PublishReadyToRun=false' || '' }}

    - name: NuGet cache (save)
      if: matrix.platform == 'x64' && steps.nuget.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.nuget/packages
        key: ${{ steps.nuget.outputs.cache-primary-key }}

    # Remove the pfx
    - name: Remove the pfx
      run: Remove-Item -path GitHubActionsWorkflow.pfx

    # Upload the MSIX package: https://github.com/marketplace/actions/upload-a-build-artifact
    - name: Upload MSIX package
      uses: actions/upload-artifact@v4
      with:
        name: MSIX_Package_${{ matrix.platform }}
        path: ${{ env.PROJECT_PATH }}\\Packages

  merge:
    if: needs.create_package.result == 'success'
    # Stays on windows-latest: the MsixBundler action shells out to makeappx.exe.
    runs-on: windows-latest
    timeout-minutes: 15
    needs: create_package
    env:
      # Never read this out of the checked-in manifest: it is pinned to 0.0.0.0, and a
      # 0.0.0.0 /bv makes makeappx invent a date-time version that disagrees with the
      # payload packages — which Partner Center rejects, irreversibly burning versions.
      PACKAGE_VERSION: ${{ needs.create_package.outputs.version }}
    # No checkout: everything this job needs comes from the uploaded artifacts.
    steps:
      - name: Verify the package version resolved
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PACKAGE_VERSION) -or $env:PACKAGE_VERSION -eq '0.0.0.0') {
            throw "create_package published no usable version (got '$env:PACKAGE_VERSION'). Refusing to build a bundle Partner Center would reject."
          }
          Write-Host "Bundling version $env:PACKAGE_VERSION"

      - name: Download all MSIX_Package_* artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: MSIX_Package_*
          path: ./msix

      - name: Copy all .msix files to temporary location
        id: copymsix
        shell: pwsh
        run: |
          # Even with AppxBundle=Never, WinAppSDK stages the framework packages
          # (WindowsAppRuntime, its DDLM/Main/Singleton, VCLibs) into
          # <package>_Test\Dependencies\<arch>\. makeappx requires every payload package
          # to share one identity, so those foreign packages must not be swept in.
          $msixFiles = @(Get-ChildItem -Path ./msix -Filter *.msix -Recurse |
            Where-Object { $_.FullName -notmatch '\\Dependencies\\' })
          # One artifact directory per matrix architecture, one payload package each.
          $expected = @(Get-ChildItem -Path ./msix -Directory -Filter MSIX_Package_*).Count
          if ($msixFiles.Count -ne $expected) {
            throw "Expected exactly one payload .msix per architecture ($expected), found $($msixFiles.Count): $($msixFiles.FullName -join ', ')"
          }
          $tmp = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetRandomFileName()); New-Item $tmp -ItemType Directory | Out-Null
          Copy-Item $msixFiles -Destination $tmp
          echo "msix_temp_dir=$tmp" >> $env:GITHUB_OUTPUT

      - name: Make msixbundle
        id: bundler
        uses: LanceMcCarthy/Action-MsixBundler@v2.0.0
        with:
          msix-folder: ${{ steps.copymsix.outputs.msix_temp_dir }}
          msixbundle-filepath: "./msix/${{ env.APP_NAME }}_${{ env.PACKAGE_VERSION }}.msixbundle"
          msixbundle-version: ${{ env.PACKAGE_VERSION }}

      - name: Make .msixupload
        shell: pwsh
        run: |
          $bundle = "./msix/${{ env.APP_NAME }}_${{ env.PACKAGE_VERSION }}.msixbundle"
          $syms = Get-ChildItem -Path ./msix -Recurse -Filter *.msixsym
          foreach ($sym in $syms) {
            $newName = [IO.Path]::ChangeExtension($sym.FullName, ".appxsym")
            Rename-Item -Path $sym.FullName -NewName $newName
          }
          $appxsymFiles = Get-ChildItem -Path ./msix -Recurse -Filter *.appxsym
          $tmp = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetRandomFileName()); New-Item $tmp -ItemType Directory | Out-Null
          Copy-Item $bundle $tmp
          Copy-Item $appxsymFiles $tmp
          Compress-Archive -Path (Join-Path $tmp '*') -DestinationPath ${{ env.APP_NAME }}_${{ env.PACKAGE_VERSION }}.msixupload -Force

      - name: Upload .msixupload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}_${{ env.PACKAGE_VERSION }}.msixupload
          path: ${{ env.APP_NAME }}_${{ env.PACKAGE_VERSION }}.msixupload