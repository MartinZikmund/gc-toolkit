name: Tag Release

# Pushes an annotated `v{NBGV-version}` tag at the commit that just built a successful Prod release.
# Runs only on release/v* pushes, once every *required* packaging workflow is green
# (see REQUIRED_RELEASE_PLATFORMS on the gate step below).

on:
  workflow_run:
    workflows:
      - "Build Windows Packages"
      - "Build Android Packages"
      - "Build iOS Packages"
    types: [completed]
    branches:
      - "release/v**"

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  tag:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The gate only needs gh + the token (GH_REPO substitutes for a checkout),
      # so it runs first — most invocations skip (the required workflows aren't all
      # green yet) and shouldn't pay for checkout/SDK/nbgv setup.
      - name: Check the required packaging workflows succeeded on this commit
        id: gate
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Which platforms must be green before a tag is pushed. Defaults to all three;
          # set the `REQUIRED_RELEASE_PLATFORMS` repository variable (e.g. "windows") to
          # ship a partial release — Android packaging is red for want of signing
          # secrets, and would otherwise block a Windows-only first Store release.
          REQUIRED_PLATFORMS: ${{ vars.REQUIRED_RELEASE_PLATFORMS || 'windows,android,ios' }}
        run: |
          declare -A workflows=(
            [windows]="Build Windows Packages"
            [android]="Build Android Packages"
            [ios]="Build iOS Packages"
          )
          IFS=',' read -ra required <<< "${REQUIRED_PLATFORMS// /}"
          for platform in "${required[@]}"; do
            wf="${workflows[$platform]}"
            if [[ -z "$wf" ]]; then
              echo "::error::Unknown platform '$platform' in REQUIRED_RELEASE_PLATFORMS; expected windows, android and/or ios."
              exit 1
            fi
            # Filter by branch as well as commit: a workflow_dispatch run of the same
            # workflow on another branch sharing this SHA must not satisfy the gate.
            ok=$(gh run list --workflow "$wf" --commit "$HEAD_SHA" --branch "$HEAD_BRANCH" --json conclusion --jq '.[0].conclusion // "none"')
            if [[ "$ok" != "success" ]]; then
              echo "Workflow '$wf' on $HEAD_SHA is '$ok' — required platforms ($REQUIRED_PLATFORMS) aren't all green yet; skipping tag."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout the built commit
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      # No setup-dotnet: the preinstalled .NET 10 SDK is enough to run nbgv.
      - name: Install nbgv
        if: steps.gate.outputs.skip != 'true'
        run: dotnet tool install -g nbgv

      - name: Tag
        if: steps.gate.outputs.skip != 'true'
        run: |
          # Every required workflow completing re-triggers this job, so the gate can pass
          # more than once for the same commit — don't fail the second time round.
          if existing=$(git describe --exact-match --tags HEAD 2>/dev/null); then
            echo "This commit is already tagged '$existing' — nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          nbgv tag
          git push origin --tags
